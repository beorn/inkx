name: Fuzz

# Continuous fuzz harness — runs all *.fuzz.ts files via vitest's `fuzz`
# project on a nightly schedule and on manual dispatch.
#
# Goals:
#   1. Catch regressions surfaced by random-input testing before they hit a user.
#   2. Persist the corpus (vimonkey __fuzz_cases__/ directories) across runs so
#      shrunk failure cases stick around as regression seeds.
#   3. On any failure: upload the corpus + raw vitest log as artifacts, and
#      print a `bd create` command via fuzz-crash-to-bead.ts so the crash is
#      tracked even if no human is watching.
#
# Tracking bead: km-infra.continuous-fuzz (parent: km-infra.guardrails).
# Source design: km-all.plateau-90 N1.

on:
  schedule:
    # 04:00 UTC every day. Off-hour pick avoids the GH Actions :00 spike.
    - cron: "7 4 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Optional FUZZ_SEED to force-reproduce a specific run"
        required: false
        type: string

# Only one fuzz run at a time per branch — a slow/long fuzz run shouldn't
# pile up if cron fires again before it finishes.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Single consolidated corpus directory. The "Stage corpus" steps copy
  # to/from this dir so we cache one path instead of a cross-repo glob,
  # which is both faster and avoids actions/cache/save@v4 hangs when the
  # glob resolves to zero matches.
  FUZZ_CORPUS_DIR: .fuzz-corpus

jobs:
  fuzz:
    name: Run fuzz suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Don't use --frozen-lockfile: the workspace pulls in submodule
        # packages whose versions can drift on submodule update; a strict
        # frozen install fails CI for reasons unrelated to fuzz coverage.
        run: bun install

      - name: Recreate mdspec vitest-plugin stub
        # vitest.config.ts imports `mdspec/vitest-plugin`, but the
        # canonical stub lives at node_modules/mdspec/ (git-untracked,
        # manually placed by local devs). bun install in CI doesn't
        # recreate it because vendor/mdspec doesn't ship a built
        # vitest-plugin.js — it only has TS sources, which vitest's
        # config-loader can't transpile through workspace boundaries.
        # This step recreates the stub the same way local dev has it.
        # Tracked: km-infra.continuous-fuzz notes — when mdspec ships a
        # built dist/, this step can be deleted.
        run: |
          mkdir -p node_modules/mdspec
          cat > node_modules/mdspec/package.json <<'JSON'
          {"name":"mdspec","version":"0.0.0","exports":{"./vitest-plugin":"./vitest-plugin.js"}}
          JSON
          cat > node_modules/mdspec/vitest-plugin.js <<'JS'
          export function mdspec() { return { name: "mdspec-stub" } }
          JS
          echo "mdspec stub recreated at node_modules/mdspec/"

      - name: Restore fuzz corpus
        id: corpus-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FUZZ_CORPUS_DIR }}
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            fuzz-corpus-${{ github.ref_name }}-
            fuzz-corpus-

      - name: Hydrate __fuzz_cases__/ from corpus
        if: steps.corpus-restore.outputs.cache-matched-key != ''
        run: |
          if [[ -d "$FUZZ_CORPUS_DIR" ]]; then
            echo "Hydrating __fuzz_cases__ dirs from $FUZZ_CORPUS_DIR"
            # Files are stored under <CORPUS_DIR>/<original-relative-path>.
            # rsync -a preserves structure; --ignore-missing-args keeps the
            # step idempotent when the corpus is empty.
            rsync -a "$FUZZ_CORPUS_DIR/" ./
          else
            echo "Corpus restore matched but no directory present (empty cache)"
          fi

      - name: Run fuzz suite
        id: fuzz
        env:
          FUZZ_SEED: ${{ inputs.seed }}
          CI: "true"
        # We DON'T fail-fast here — we want the post-fuzz steps (stage
        # corpus, upload artifacts, file bead) to run even when fuzz
        # fails. The `outcome` is captured for the gating later.
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p test-results
          # `bun run test:fuzz` runs `bun vitest run --project fuzz` — see package.json.
          # --reporter=verbose makes the per-test FAIL line stable for the
          # bead-creation script's regex.
          bun vitest run --project fuzz --reporter=verbose 2>&1 | tee test-results/fuzz.log

      - name: Stage corpus for caching
        if: always()
        run: |
          mkdir -p "$FUZZ_CORPUS_DIR"
          # Find every __fuzz_cases__/ directory and mirror it under the
          # consolidated corpus dir, preserving the original path so a
          # subsequent hydrate step can rsync it back into place.
          # If no dirs exist, leave the corpus dir empty — the cache step
          # below still saves the (empty) dir, which is fine.
          mapfile -t cases < <(find . -type d -name '__fuzz_cases__' \
            -not -path "./$FUZZ_CORPUS_DIR/*" \
            -not -path './node_modules/*' \
            -not -path './.git/*')
          echo "Found ${#cases[@]} __fuzz_cases__ dir(s)"
          for src in "${cases[@]}"; do
            rel="${src#./}"
            dst="$FUZZ_CORPUS_DIR/$rel"
            mkdir -p "$(dirname "$dst")"
            rsync -a "$src/" "$dst/"
          done

      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FUZZ_CORPUS_DIR }}
          key: fuzz-corpus-${{ github.ref_name }}-${{ github.run_number }}

      - name: Upload fuzz log
        if: steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-log-${{ github.run_number }}
          path: test-results/fuzz.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload fuzz corpus
        if: steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ github.run_number }}
          path: ${{ env.FUZZ_CORPUS_DIR }}
          if-no-files-found: warn
          retention-days: 30

      # The runner doesn't have credentials to commit bead markdown to the
      # repo, so this step prints the `km bd create` command into the
      # workflow log for human follow-up. The script is idempotent — re-runs
      # against the same seed produce the same bead ID and append-note
      # instead of creating duplicates. When a write-capable token is wired
      # into the workflow, the dry-run gate can be removed and the script
      # can commit the @km/<scope>/<slug>.md file + git push directly
      # (Dolt-backend cutover, 2026-04-29).
      - name: File bead for fuzz crash (dry-run)
        if: steps.fuzz.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ ! -f test-results/fuzz.log ]]; then
            echo "::warning::no fuzz log to scan; skipping bead creation"
            exit 0
          fi
          echo "::group::fuzz-crash-to-bead (dry-run)"
          bun packages/km-infra/scripts/fuzz-crash-to-bead.ts \
            --input test-results/fuzz.log \
            --run-url "$RUN_URL" \
            --dry-run \
            || echo "::warning::fuzz-crash-to-bead failed to extract a crash"
          echo "::endgroup::"
          echo "::notice::Fuzz failed. Reproduce locally; the printed bd create command above can be run by a maintainer with bd access to file the bead."

      # Final gate: if fuzz failed, fail the job so the run shows red and
      # GitHub notifies. Without this, `continue-on-error` on the fuzz step
      # would let the job report green even on real fuzz crashes.
      - name: Mark job failed if fuzz failed
        if: steps.fuzz.outcome == 'failure'
        run: |
          echo "::error::fuzz suite reported failures — see uploaded log + corpus artifacts"
          exit 1
