<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>km on Canvas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #1e1e2e;
        color: #cdd6f4;
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      h1 {
        font-size: 16px;
        color: #89b4fa;
        margin: 0 0 8px;
      }
      .subtitle {
        font-size: 12px;
        color: #6c7086;
        margin-bottom: 12px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .controls label {
        color: #6c7086;
        font-size: 12px;
      }
      .controls input[type="range"] {
        flex: 1;
        max-width: 300px;
        accent-color: #89b4fa;
      }
      .controls .value {
        color: #cdd6f4;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        min-width: 50px;
      }
      .controls select {
        background: #313244;
        color: #cdd6f4;
        border: 1px solid #45475a;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
      #viewport {
        border: 1px solid #45475a;
        border-radius: 8px;
        overflow: hidden;
        display: inline-block;
      }
      canvas {
        display: block;
      }
      #status {
        margin-top: 8px;
        font-size: 11px;
        color: #6c7086;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>km on Canvas</h1>
    <p class="subtitle">Same BoardCore component rendered via renderToCanvas() with proportional text</p>

    <div class="controls">
      <label>Width</label>
      <input type="range" id="width-slider" min="400" max="1200" value="800" step="1" />
      <span class="value" id="width-value">800px</span>
      <label>Font</label>
      <select id="font-select">
        <option value='"Inter", system-ui, sans-serif'>Inter</option>
        <option value='"SF Pro Text", system-ui, sans-serif'>SF Pro</option>
        <option value="system-ui, sans-serif">System</option>
        <option value="monospace">Monospace</option>
      </select>
    </div>

    <div id="viewport">
      <canvas id="canvas" width="800" height="600"></canvas>
    </div>

    <div id="status">Loading...</div>

    <script type="module" src="./km-canvas.tsx"></script>
  </body>
</html>
