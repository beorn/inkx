# Recall Evaluation Corpus — starter pairs (v0)
#
# Format: each entry is a labeled retrieval test. The runner
# (tools/recall-eval.ts) reads this file, runs each query through
# the recall pipeline, and grades the result against the labels.
#
# Bead: km-tribe.recall-eval-corpus
#
# v0 design choice: the corpus stores the *query* the system should use,
# not the conversation prefix it should derive from. That separates two
# concerns — query-derivation quality (Salience trigger / strategy) from
# substrate retrieval quality (FTS + planner + reranker). v1 may add a
# `prefix` field to also test query-derivation.
#
# Field reference:
#   id                        — stable identifier
#   query                     — the search string to feed the recall pipeline
#   axis                      — A=conversational, B=external-data, C=multi-turn
#   expected_relevant         — session IDs / artifact references that SHOULD appear in top-K
#   expected_irrelevant       — token-overlap traps that must NOT appear
#   notes                     — why these are/aren't relevant (free text)
#   conversation_prefix       — optional, for context only — not used by runner v0

pairs:
  # ── Axis A: conversational retrieval ────────────────────────────

  - id: pair-001
    axis: A
    query: "mem-thought hypothesis test ambient injection"
    expected_relevant_session_ids:
