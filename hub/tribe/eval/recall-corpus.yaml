    expected_irrelevant_session_ids:
      - "87d20187"  # bg-recall/tests/relevance.test.ts — incidental "relevance" overlap
    notes: |
      Query asks about the mem-thought hypothesis test. Right answer is the
      session that designed it (this one, 4de4a3ab). Wrong answer is the
      relevance.test.ts file in bg-recall — it contains the literal token
      "relevance" but is unrelated infrastructure.

